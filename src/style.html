<title>爆走キックボード 全国版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;700;900&display=swap">
<style>
/* Layout: one full-screen stage; screens swap in place. Road-sign palette: expressway green, toll amber, national-route blue on asphalt. */
:root{
  --asphalt:#14181d; --asphalt2:#1f252c; --line:#323b45; --paper:#eef3f1; --mute:#93a0a8;
  --hw:#0b8a56; --toll:#e8920c; --nat:#1b62d6; --lamp:#ffd400; --bad:#e8423a;
  --disp:"Dela Gothic One","Noto Sans JP",sans-serif; --body:"Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--asphalt);color:var(--paper);font-family:var(--body);font-size:15px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:manipulation}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
[hidden]{display:none!important}
.screen{position:absolute;inset:0;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;min-height:0}
h1,h2{font-family:var(--disp);font-weight:400;margin:0;line-height:1.1;text-wrap:balance}
.btn{border:0;border-radius:10px;padding:13px 22px;font-weight:900;background:var(--lamp);color:#1a1500;letter-spacing:.04em;box-shadow:0 4px 0 #a88c00}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a88c00}
.btn.ghost{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 2px var(--line)}
.btn[disabled]{opacity:.35;pointer-events:none}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bar h2{font-size:clamp(20px,4.6vw,30px)}
/* title */
#sTitle{justify-content:center;align-items:flex-start;background:linear-gradient(180deg,#0b1522 0%,#1b2b3f 55%,#2c3a4a 55%,#14181d 100%)}
#sTitle .road{position:absolute;left:0;right:0;bottom:0;height:45%;overflow:hidden;z-index:0}
#sTitle .road i{position:absolute;left:50%;bottom:0;width:6px;height:100%;background:repeating-linear-gradient(180deg,var(--lamp) 0 24px,transparent 24px 60px);transform:translateX(-50%) perspective(200px) rotateX(30deg);transform-origin:bottom;animation:flow 1s linear infinite}
@keyframes flow{to{background-position:0 60px}}
#sTitle>*:not(.road){position:relative;z-index:1}
.tag{font-weight:900;letter-spacing:.2em;color:var(--lamp);font-size:12px}
#sTitle h1{font-size:clamp(44px,13vw,110px);transform:skewX(-6deg);text-shadow:4px 4px 0 var(--nat),8px 8px 0 #0008}
#sTitle p{max-width:34em;color:#c9d4dc;margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;overflow:auto;min-height:0;flex:1;align-content:start}
.card{background:var(--asphalt2);border:2px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px}
.card:hover,.card.on{border-color:var(--lamp)}
.card h3{margin:0;font-family:var(--disp);font-weight:400;font-size:20px}
.card small{color:var(--mute);line-height:1.5}
/* map */
#sMap .main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px}
.mapbox{background:#0c1a2b;border:2px solid var(--line);border-radius:14px;min-height:0;position:relative;overflow:hidden}
.mapbox svg{width:100%;height:100%;display:block}
.land{fill:#243a33;stroke:#3f6b5c;stroke-width:.6}
.rt{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:.5;cursor:pointer;pointer-events:stroke}
.rt.hw{stroke:var(--hw)}.rt.toll{stroke:var(--toll)}.rt.nat{stroke:var(--nat)}.rt.area{stroke:#b07dff}
.rt.on{opacity:1;stroke-width:5;filter:drop-shadow(0 0 3px #fff8)}
.rt.dim{opacity:.12}
.city circle{fill:#fff}.city text{fill:#d6e2ea;font-size:8px;font-weight:700;paint-order:stroke;stroke:#0c1a2b;stroke-width:2px}
.side{display:flex;flex-direction:column;gap:10px;min-height:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-weight:700}
.tab.on{background:var(--paper);color:#10161b;border-color:var(--paper)}
.tab[data-k=hw].on{background:var(--hw);color:#fff;border-color:var(--hw)}
.tab[data-k=toll].on{background:var(--toll);color:#1a1000;border-color:var(--toll)}
.tab[data-k=nat].on{background:var(--nat);color:#fff;border-color:var(--nat)}
.list{overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:0;flex:1}
.rc{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--asphalt2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left}
.rc.on{border-color:var(--lamp)}
.badge{min-width:54px;text-align:center;border-radius:6px;padding:6px 8px;font-weight:900;font-size:13px;color:#fff;border:2px solid #fff8}
.badge.hw{background:var(--hw)}.badge.toll{background:var(--toll);color:#1a1000}.badge.nat{background:var(--nat)}.badge.area{background:#7a3ff0}
.rc b{display:block;font-size:15px}.rc span{color:var(--mute);font-size:12px}
.stars{color:var(--lamp);letter-spacing:2px;font-size:13px;white-space:nowrap}
.detail{background:var(--asphalt2);border-radius:12px;padding:12px 14px;line-height:1.6;font-size:13px;color:#cfd9df;border-left:6px solid var(--lamp)}
/* option rows */
.opt{display:flex;gap:8px;flex-wrap:wrap}
.opt button{flex:1;min-width:110px;border:2px solid var(--line);background:var(--asphalt2);border-radius:12px;padding:12px;font-weight:700;text-align:left}
.opt button.on{border-color:var(--lamp);background:#2a2910}
.opt small{display:block;font-weight:400;color:var(--mute);margin-top:4px}
.lbl{font-size:12px;letter-spacing:.14em;color:var(--mute);font-weight:900;margin:6px 0 -4px}
/* game */
#sGame{padding:0;background:#000;overflow:hidden}
#gl,#fx{position:absolute;inset:0}
#gl canvas{width:100%;height:100%;display:block}
#fx{pointer-events:none;opacity:0;transition:opacity .3s;background:repeating-conic-gradient(from 0deg at 50% 52%,#fff0 0 3deg,#ffffff55 3.4deg 3.6deg,#fff0 4deg 9deg);-webkit-mask:radial-gradient(circle at 50% 52%,#0000 18%,#000 75%);mask:radial-gradient(circle at 50% 52%,#0000 18%,#000 75%)}
#fx.on{opacity:.8;animation:spin 1.2s linear infinite}
@keyframes spin{to{filter:hue-rotate(0)}}
.hud{position:absolute;inset:0;pointer-events:none;color:#fff;font-weight:700;text-shadow:0 1px 4px #0008}
.hl{position:absolute;left:max(14px,env(safe-area-inset-left,0px));top:max(10px,env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;width:min(300px,56vw)}
.sc small,.tm small{font-size:10px;letter-spacing:.2em;color:#dde6ee;margin-right:8px}
.sc b{font-size:20px;font-variant-numeric:tabular-nums}
.chip{position:relative;display:flex;align-items:center;gap:8px;background:#2a3038cc;border-radius:999px;padding:5px 12px 7px 6px;font-size:13px;overflow:hidden}
.chip .jy{background:#7ac143;color:#10200a;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:900}
.chip span:nth-child(2){font-size:11px;color:#cfd8df}
.chip b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip em{font-style:normal;font-size:12px;color:#cfd8df;font-variant-numeric:tabular-nums}
.chip i{position:absolute;left:0;bottom:0;height:3px;width:0;background:#7ac143}
.tm b{font-size:34px;font-style:italic;font-variant-numeric:tabular-nums}
.tm span{display:block;color:#ff4d4d;font-weight:900;font-size:16px;min-height:20px}
.hr{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:max(10px,env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ic{display:flex;gap:10px}
.ic button{pointer-events:auto;width:40px;height:40px;border-radius:50%;border:0;background:#2a3038cc;color:#fff;font-size:15px}
.gauge{position:relative;width:min(120px,26vw)}
.gauge svg{width:100%;display:block}
.gb,.ga{fill:none;stroke-width:4;stroke-linecap:round}
.gb{stroke:#ffffff40}.ga{stroke:#31d6a0;transition:stroke .2s}
.gv{position:absolute;left:0;right:0;top:34%;text-align:center;line-height:1}
.gv b{font-size:22px;font-style:italic;font-variant-numeric:tabular-nums}
.gv small{display:block;font-size:9px;color:#dde}
.lim{font-size:9px;letter-spacing:.14em;display:flex;gap:6px;align-items:center;color:#ffb42e}
#hSeg{display:flex;gap:2px}#hSeg i{width:7px;height:5px;border-radius:1px;background:#ffffff40}#hSeg i.on{background:#ffb42e}
.cmb{font-size:12px;color:#ffd54a;font-weight:900;min-height:16px}
.hearts{position:absolute;left:50%;top:max(150px,calc(env(safe-area-inset-top,0px) + 140px));top:22%;transform:translateX(-50%);background:#2a3038b0;border-radius:999px;padding:4px 12px;font-size:17px;letter-spacing:4px;color:#ff4d6a;pointer-events:none}
.light{position:absolute;left:50%;top:26%;transform:translateX(-50%);display:none;gap:12px;background:#22262c;border-radius:16px;padding:14px 18px;box-shadow:0 8px 24px #0006}
.light.on{display:flex}
.light i{width:48px;height:48px;border-radius:50%;background:#33373d}
.light i.r{background:#ff3b4a}.light i.g{background:#3bff7a}
.count{position:absolute;left:50%;top:42%;transform:translateX(-50%);font-family:var(--disp);font-size:clamp(70px,16vw,130px);font-style:italic;color:#f4f6f8;text-shadow:0 8px 30px #0006;pointer-events:none}
.msg{position:absolute;left:50%;top:36%;transform:translateX(-50%);text-align:center;pointer-events:none;color:#35e0c0;font-weight:900;letter-spacing:.1em;font-size:14px;opacity:0;text-shadow:0 2px 8px #0008}
.msg b{display:block;font-size:clamp(26px,6vw,40px);color:#fff;font-style:italic}
.msg2{position:absolute;left:50%;top:58%;transform:translateX(-50%);color:#fff;font-size:15px;font-weight:900;pointer-events:none;opacity:0}
.bigmsg{position:absolute;left:0;right:0;top:44%;text-align:center;font-size:clamp(28px,7vw,54px);font-weight:900;letter-spacing:.16em;color:#fff;font-style:italic;pointer-events:none;opacity:0;text-shadow:0 4px 18px #0008}
.heart-b{position:absolute;left:50%;top:44%;font-size:90px;transform:translate(-50%,-50%);opacity:0;pointer-events:none}
.show{animation:pop .9s ease-out}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.8)}15%{opacity:1;transform:translateX(-50%) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-14px)}}
.bigmsg.show{animation:popb 1.4s ease-out}.heart-b.show{animation:popH .8s ease-out}
@keyframes popb{0%{opacity:0;letter-spacing:.5em}20%{opacity:1;letter-spacing:.16em}80%{opacity:1}100%{opacity:0}}
@keyframes popH{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
.touch{position:absolute;left:0;right:0;bottom:0;top:30%;display:none}
.touch.on{display:flex}
.touch button{flex:1;background:transparent;border:0;pointer-events:auto}
.jump{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:max(24px,calc(env(safe-area-inset-bottom,0px) + 24px));display:none;width:76px;height:76px;border-radius:50%;background:#f6a52acc;color:#2a1500;font-weight:900;border:3px solid #fff;z-index:3;font-size:13px}
.touch.on~.jump{display:block}
#over{position:absolute;inset:0;background:#000b;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;z-index:5}
#over.on{display:flex}
#over h2{font-size:clamp(30px,8vw,56px);color:var(--lamp)}
.res{display:grid;grid-template-columns:auto auto;gap:6px 22px;font-weight:700;text-align:left}
.res span:nth-child(odd){color:var(--mute)}
.res span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.how{background:var(--asphalt2);border:2px solid var(--line);border-radius:14px;padding:14px 16px;line-height:1.8;max-width:46em}
@media (max-width:760px){
  #sMap .main{grid-template-columns:1fr;grid-template-rows:minmax(150px,34%) minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){#sTitle .road i{animation:none}.toast.show{animation:none;opacity:1}}
</style>
